<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
          integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
          crossorigin="anonymous">

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap-theme.min.css"
          integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp"
          crossorigin="anonymous">

    <title>Paris 2024</title>

    <style>
        body {
            padding-top: 50px;
        }

        .special {
            padding-top: 50px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-inverse navbar-fixed-top">
    <div class="container">
        <div class="navbar-header">
            <a class="navbar-brand" href="..">Athlètes</a>
            <a class="navbar-brand" href="/sports">Sports</a>
            <a class="navbar-brand" href="/epreuves">Épreuves</a>
            <a class="navbar-brand" href="/actualites">Actualité</a>
        </div>
    </div>
</nav>


<div class="container special">

    <h2 class="h2">Ajout d'un nouveau partenaire</h2>
    <div>
        <form method="post"
              th:action="@{/entreprise/saveEntreprise}" th:object="${entreprise}">
            <div class="form-group">
                <label for="nomInput">Nom</label>
                <input
                        type="text" th:field="*{nom}" class="form-control" id="firstNameInput"
                        aria-describedby="prenomHelp" placeholder="Saisir le nom"> <small
                    id="nomHelp" class="form-text text-muted">Merci d'écrire le nom du partenaire.</small>
            </div>
            <div class="form-group">
                <label for="activiteInput">Activité</label>
                <input
                        type="text" th:field="*{activite}" class="form-control" id="nomInput"
                        aria-describedby="nomHelp" placeholder="Saisir le nom"> <small
                    id="nomHelp" class="form-text text-muted">Merci d'écrire l'activité du partenaire.</small>
            </div>

            </br>
            </br>

            <div class="form-group">
                <label for="categorie">Categories :</label>
                <select id="categorie" class="form-control" th:field="*{categorie.id}">
                    <option value="">Sélectionnez une catégorie</option>
                    <option th:each="categorie : ${listCategorie}" th:value="${categorie.id}" th:text="${categorie.libelle}"></option>
                </select>
            </div>


            <button type="submit" class="btn btn-primary">Créer</button>
        </form>
    </div>

</div>

<script
        src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<script
        src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"
        integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
        crossorigin="anonymous"></script>
</body>
</html>
