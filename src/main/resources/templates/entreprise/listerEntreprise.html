<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Partenaires - Paris 2024</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
          integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
          crossorigin="anonymous">

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap-theme.min.css"
          integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp"
          crossorigin="anonymous">

    <style>
        body {
            padding-top: 50px;
        }
        .special {
            padding-top: 50px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-inverse navbar-fixed-top">
    <div class="container">
        <div class="navbar-header">
            <a class="navbar-brand" href=".">Athlètes</a>
            <a class="navbar-brand" href="/sports">Sports</a>
            <a class="navbar-brand" href="/epreuves">Épreuves</a>
            <a class="navbar-brand" href="/actualites">Actualité</a>
            <a class="navbar-brand" href="/entreprises">Partenaires</a>
        </div>
    </div>
</nav>

<div class="container special">
    <h2 class="h2">Liste des partenaires</h2>
    <div class="table-responsive">
        <table class="table table-striped table-sm" >
            <thead>
            <tr>
                <th>Nom</th>
                <th>Activité</th>
                <th>Catégorie</th>
                <th>Investissements</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${entreprises.empty}">
                <td colspan="4">Aucune entreprise en base de données</td>
            </tr>
            <tr th:each="entreprise : ${entreprises}">
                <td th:text="${entreprise.nom}">Nom</td>
                <td th:text="${entreprise.activite}">Activité</td>
                <td th:text="${entreprise.categorie.libelle}">Catégorie</td>
                <td>
                    <ul th:if="${entreprise.investissements != null}" th:each="inv : ${entreprise.investissements}">
                        <li>
                            <strong th:text="${inv.sport.nom}"></strong> :
                            <span th:text="${inv.montant}"></span> €
                        </li>
                    </ul>
                    <span th:if="${entreprise.investissements == null || #lists.isEmpty(entreprise.investissements)}">Aucun</span>
                </td>
            </tr>
            </tbody>
        </table>

        <h4><a th:href="@{/entreprise/createEntreprise}">Ajouter un nouveau partenaire</a></h4>

    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"
        integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
        crossorigin="anonymous"></script>
</body>
</html>
